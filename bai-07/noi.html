<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>聊 · Luyện nói</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css">
<style>
[hidden] { display: none !important }
:root {
  --desk: #dcd6cb; --paper: #f1ebdf; --paper-2: #e9e1d1; --rule: #d9cfbd; --ink: #2b2620; --muted: #6c6255;
  --red: #9b3328; --red-soft: #f3ded8; --green: #2f7a4f; --clip: #9aa0a6; --spine: #2d2622; --ring: #c9c4bd;
  --note: #ece4d2; --tape: rgba(222, 205, 170, .78); --line-box: #f7f2e8; --on-red: #fff8f0;
  --hand: "Times New Roman", Times, serif; --body: "Times New Roman", Times, serif;
  --pinyin: "Times New Roman", Times, serif; --han: "KaiTi", "楷体", "STKaiti", "Kaiti SC", "LXGW WenKai", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --desk: #191715; --paper: #2a2621; --paper-2: #322d27; --rule: #463f36; --ink: #efe7da; --muted: #b5aa99;
  --red: #e2826f; --red-soft: #452a24; --green: #79c99a; --clip: #8b9096; --spine: #0e0c0b; --ring: #8d8780;
  --note: #3a342c; --tape: rgba(120, 104, 80, .7); --line-box: #2f2a24; --on-red: #1d1410 } }
:root[data-theme="dark"] {
  --desk: #191715; --paper: #2a2621; --paper-2: #322d27; --rule: #463f36; --ink: #efe7da; --muted: #b5aa99;
  --red: #e2826f; --red-soft: #452a24; --green: #79c99a; --clip: #8b9096; --spine: #0e0c0b; --ring: #8d8780;
  --note: #3a342c; --tape: rgba(120, 104, 80, .7); --line-box: #2f2a24; --on-red: #1d1410 }

* { box-sizing: border-box }
body { margin: 0; background: var(--desk); color: var(--ink); font: 16px/1.55 var(--body) }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid var(--red); outline-offset: 2px }

.wrap { max-width: 1240px; margin: 0 auto; padding: 20px 16px 48px }
.back { display: inline-block; margin-bottom: 12px; color: var(--muted); font-size: 1rem; text-decoration: none }
.back:hover { color: var(--red) }

/* Sổ còng */
.book { position: relative; background: var(--paper); border-radius: 6px 14px 14px 6px; padding: 30px 40px 40px 104px; min-height: 80vh;
  box-shadow: 0 18px 40px -22px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.05);
  background-image: radial-gradient(rgba(0,0,0,.025) 1px, transparent 1px); background-size: 6px 6px }
.spine { position: absolute; left: 0; top: 0; bottom: 0; width: 56px; background: var(--spine); border-radius: 6px 0 0 6px;
  box-shadow: inset -6px 0 10px rgba(0,0,0,.35) }
.rings { position: absolute; left: 22px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: space-around; padding: 28px 0 }
.ring { width: 58px; height: 26px; border: 4px solid var(--ring); border-left-color: transparent; border-radius: 0 14px 14px 0;
  background: linear-gradient(90deg, transparent 60%, rgba(255,255,255,.18)); box-shadow: 2px 2px 3px rgba(0,0,0,.25) }
.ring::before { content: ""; display: block; width: 10px; height: 10px; border-radius: 50%; background: var(--desk); margin: 0 0 0 40px; transform: translateY(0) }

.top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; padding-bottom: 14px; border-bottom: 1px dashed var(--rule) }

.dice { width: 84px; height: 84px; border-radius: 50%; border: 0; background: var(--red); color: var(--on-red);
  display: grid; place-content: center; text-align: center; line-height: 1.05; box-shadow: 0 6px 14px -6px rgba(155,51,40,.7), inset 0 -3px 0 rgba(0,0,0,.18) }
.dice b { font-family: var(--han); font-size: 1.9rem; font-weight: 700 }
.dice span { font-size: .8rem; font-weight: 700; letter-spacing: .02em }
.dice:hover { transform: rotate(-6deg) }
.dice.spin b { animation: spin .5s ease }
@keyframes spin { from { transform: rotate(0) } to { transform: rotate(360deg) } }

.range h2 { margin: 0 0 8px; font-family: var(--hand); font-size: 1.4rem; font-weight: 700; color: var(--ink); line-height: 1.1 }
.range p { margin: 0 0 8px; font-size: .82rem; color: var(--muted) }
.lessons { display: flex; flex-wrap: wrap; gap: 8px }
.lesson { border: 1.5px solid var(--rule); background: var(--line-box); border-radius: 10px; padding: 6px 12px; text-align: left; display: grid; line-height: 1.25 }
.lesson small { font-size: .85rem; color: var(--muted) }
.lesson b { font-size: 1.05rem }
.lesson[aria-pressed="true"] { border-color: var(--red); background: var(--red-soft) }
.lesson.in:not([aria-pressed="true"]) { border-style: dashed; border-color: var(--red) }

.note { position: relative; background: var(--note); padding: 12px 14px 10px;
  clip-path: polygon(0 4%, 6% 0, 14% 3%, 25% 0, 38% 4%, 52% 1%, 66% 4%, 80% 0, 92% 3%, 100% 1%, 100% 100%, 0 100%);
  box-shadow: 0 4px 10px -6px rgba(0,0,0,.4); transform: rotate(1.5deg) }
.clip { position: absolute; right: 18px; top: -26px; width: 20px; height: 52px; border: 3px solid var(--clip); border-radius: 10px; z-index: 2 }
.clip::after { content: ""; position: absolute; left: 3px; top: 8px; width: 8px; height: 34px; border: 3px solid var(--clip); border-radius: 6px }
.note h2 { margin: 0 0 8px; font-family: var(--hand); font-size: 1.35rem; line-height: 1 }
.hbtns { display: flex; gap: 6px }
.hbtn { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--ink); background: transparent; font-family: var(--hand); font-size: 1.25rem; font-weight: 700; line-height: 1 }
.hbtn:hover:not(:disabled):not([aria-pressed="true"]) { background: var(--paper) }
.hbtn[aria-pressed="true"] { background: var(--ink); color: var(--paper) }
.hbtn:disabled { opacity: .35; cursor: not-allowed }
.note .lg { margin: 8px 0 0; font-size: .9rem; color: var(--muted); line-height: 1.4 }

.work { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, 1fr); gap: 28px; align-items: start; margin-top: 22px }
.stage { display: grid; justify-items: center; gap: 6px; padding-top: 14px }
.side { display: grid; gap: 14px; align-content: start; padding-top: 4px }
.side > * { margin: 0 }
.box.gbox { padding: 12px 14px 14px; background-image: none; border: 1px dashed var(--rule) }
.gbox h3 { margin: 0 }
.gbox #gram { display: grid; justify-items: start; gap: 6px; margin-top: 8px }
.gbox .form { margin: 0 }
.hintbox { background: var(--line-box); border-radius: 4px; padding: 12px 14px 14px; display: grid; gap: 4px; border: 1px dashed var(--rule) }
.note { transform: rotate(.8deg) !important }
.photo { position: relative; margin: 0; width: fit-content; max-width: 100%; background: #fff; padding: 10px 10px 12px; box-shadow: 4px 6px 14px -6px rgba(0,0,0,.45); transform: rotate(-1.2deg) }
.photo::before { content: ""; position: absolute; top: -14px; left: 50%; width: 110px; height: 28px; margin-left: -55px; background: var(--tape); transform: rotate(2deg) }
.frame { display: grid; place-items: center; background: var(--paper-2); min-width: 240px; min-height: 180px }
.frame img { display: block; width: auto; height: auto; max-width: 100%; max-height: min(560px, 70vh) }
.frame:has(img) { min-width: 0; min-height: 0; background: #fff }
.empty { padding: 16px; text-align: center; font-family: var(--hand); font-size: 1.3rem; color: var(--muted); line-height: 1.2 }
.count { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums }

.box { background: var(--line-box); border-radius: 4px; padding: 14px 18px 16px; margin-top: 14px;
  background-image: repeating-linear-gradient(transparent 0 31px, var(--rule) 31px 32px); background-position: 0 10px; box-shadow: 0 1px 0 rgba(0,0,0,.04) }
.box h3 { margin: 0 0 6px; font-family: var(--hand); font-size: 1.35rem; line-height: 1.1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px }
.box h3 small { font-family: var(--body); font-size: .8rem; color: var(--muted); font-weight: 500 }
.tip { margin: 0; font-size: .95rem; color: var(--muted) }
.hint { margin-top: 6px }
.hint:first-child { margin-top: 0 }
.hint h4 { margin: 0 0 6px; font-size: 1rem; color: var(--red); font-weight: 700 }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chip { border: 1px solid var(--rule); background: var(--paper); border-radius: 10px; padding: 6px 12px; display: grid; justify-items: start; text-align: left; line-height: 1.25 }
.chip .p { font-family: var(--pinyin); font-size: 1.05rem; color: var(--green); letter-spacing: .01em }
.chip .h { font-family: var(--han); font-size: 1.15rem }
.chip .v { font-size: .88rem; color: var(--muted) }

.gtitle { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px }
.form { display: inline-block; font-family: var(--body); font-size: 1.08rem; border: 1.5px dashed var(--red); border-radius: 8px; padding: 4px 10px; margin: 4px 0 8px }
.gname { font-family: var(--body); font-size: 1.3rem; font-weight: 700 }
.zp b { font-size: .92em }
.zp { display: inline-grid; justify-items: center; vertical-align: bottom; line-height: 1.2; margin: 0 1px }
.zp i { font-style: normal; font-family: var(--pinyin); font-size: .75em; font-weight: 400; color: var(--green) }
.zp b { font-family: var(--han); font-weight: inherit }
.form .zp i { font-size: .82em }
.gex { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: start; padding: 6px 0 }
.gex .p { font-family: var(--pinyin); color: var(--green) }
.gex .h { font-family: var(--han); font-size: 1.08rem }
.gex .v { font-size: .85rem; color: var(--muted) }
.small { border: 1px solid var(--ink); background: transparent; border-radius: 999px; padding: 5px 14px; font-size: .9rem; font-weight: 600 }
.small:hover { background: var(--paper) }
.say { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--red-soft); color: var(--red); display: grid; place-items: center }
.say.on { background: var(--red); color: var(--on-red) }

textarea { width: 100%; min-height: 96px; resize: vertical; border: 0; background: transparent; font: 1.35rem/32px var(--hand); color: var(--ink); padding: 0 }
.status { min-height: 1.3em; font-size: .85rem; color: var(--muted); margin: 6px 0 0 }

@media (max-width: 680px) {
  .book { padding: 20px 14px 26px 44px }
  .spine { width: 26px }
  .rings { left: 6px }
  .ring { width: 34px; height: 14px; border-width: 3px }
  .ring::before { margin-left: 20px; width: 7px; height: 7px }
  .work { display: flex; flex-direction: column; align-items: stretch; gap: 14px }
  .side { display: contents }
  .gbox { order: -1 }
  .stage { justify-items: center }
  .frame img { max-height: 380px }
  .dice { width: 70px; height: 70px }
  .dice b { font-size: 1.6rem }
}
@media (prefers-reduced-motion: reduce) { .dice.spin b { animation: none } }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./">← Khẩu ngữ cấp tốc Bài 7</a>
  <main class="book" aria-label="Luyện nói theo hình">
    <div class="spine" aria-hidden="true"></div>
    <div class="rings" aria-hidden="true"><i class="ring"></i><i class="ring"></i><i class="ring"></i><i class="ring"></i><i class="ring"></i><i class="ring"></i></div>

    <div class="top">
      <button class="dice" id="dice" type="button" aria-label="Rút một hình ngẫu nhiên"><b>聊</b><span>Rút hình</span></button>
      <section class="range" aria-labelledby="rangeH">
        <h2 id="rangeH">Học đến bài nào?</h2>
        <div class="lessons" id="lessons"></div>
      </section>
    </div>

    <div class="work">
      <div class="stage">
        <figure class="photo"><div class="frame" id="frame"><div class="empty">Bấm nút 聊<br>để rút một bức hình</div></div></figure>
        <span class="count" id="count"></span>
      </div>
      <aside class="side" aria-labelledby="noteH">
        <section class="box gbox" aria-labelledby="gramH">
          <div class="gtitle"><h3 id="gramH">Điểm ngữ pháp</h3><button class="small" id="regram" type="button">Đổi cấu trúc</button></div>
          <div id="gram"></div>
        </section>
        <div class="note">
          <span class="clip" aria-hidden="true"></span>
          <h2 id="noteH">Gợi ý</h2>
          <div class="hbtns" id="hbtns"></div>
          <p class="lg">1 nhân vật · 2 nơi chốn · 3 thời gian · 4 sự kiện</p>
        </div>
        <div class="hintbox" id="hints" aria-live="polite"><p class="tip">Rút hình trước, rồi mở từng gợi ý khi cần.</p></div>
      </aside>
    </div>

    <p class="status" id="status" aria-live="polite"></p>
  </main>
</div>

const HINTNAMES = ["Nhân vật và mối quan hệ", "Nơi chốn", "Thời gian", "Sự kiện chính"];

const $ = id => document.getElementById(id);
const make = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const key = t => (t || "").replace(/[^一-鿿]/g, "");
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

const UPKEY = "liao-upto:" + location.pathname;
let upTo = +store.get(UPKEY, 0);
if (!LESSONS.some(l => l.n === upTo)) upTo = LESSONS[LESSONS.length - 1].n;
let deck = [], pic = null, opened = new Set(), gram = null;

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pool = () => PICS.filter(p => p.bai <= upTo);

function renderLessons() {
  const box = $("lessons"); box.replaceChildren();
  LESSONS.forEach(l => {
    const b = make("button", "lesson" + (l.n < upTo ? " in" : "")); b.type = "button";
    b.setAttribute("aria-pressed", String(l.n === upTo));
    b.append(make("small", "", "Đến bài " + l.n), make("b", "", l.name));
    b.onclick = () => { upTo = l.n; store.set(UPKEY, String(upTo)); deck = []; renderLessons(); if (pic && pic.bai > upTo) draw(); rollGram(); updateCount(); };
    box.append(b);
  });
}

function renderHintBtns() {
  const box = $("hbtns"); box.replaceChildren();
  HINTNAMES.forEach((n, i) => {
    const b = make("button", "hbtn", String(i + 1)); b.type = "button";
    b.setAttribute("aria-label", "Gợi ý " + (i + 1) + ": " + n); b.title = n;
    b.setAttribute("aria-pressed", String(opened.has(i)));
    b.onclick = () => { if (!pic) draw(); opened.has(i) ? opened.delete(i) : opened.add(i); renderHintBtns(); renderHints(); };
    box.append(b);
  });
}

function chip(w) {
  const b = make("span", "chip");
  b.append(make("span", "p", w.py), make("span", "h", w.han), make("span", "v", w.vi));
  b.querySelector(".h").lang = "zh-CN";
  return b;
}
function renderHints() {
  const box = $("hints"); box.replaceChildren();
  if (!pic) { box.append(make("p", "tip", "Rút hình trước, rồi mở từng gợi ý khi cần.")); return; }
  if (!opened.size) { box.append(make("p", "tip", "Thử tự nói trước. Bí thì bấm số 1, 2, 3, 4 trên mẩu giấy ghim.")); return; }
  [...opened].sort().forEach(i => {
    const sec = make("div", "hint");
    sec.append(make("h4", "", "Gợi ý " + (i + 1) + " · " + HINTNAMES[i]));
    const c = make("div", "chips"); pic.hints[i].forEach(w => c.append(chip(w)));
    sec.append(c); box.append(sec);
  });
}

/* Chữ Hán trong tên và công thức ngữ pháp: phiên âm đặt ngay phía trên */
function segs(el, list) {
  list.forEach(([t, py]) => {
    if (!py) { el.append(t); return; }
    const z = make("span", "zp"), i = make("i", "", py), b = make("b", "", t);
    b.lang = "zh-CN"; z.append(i, b); el.append(z);
  });
  return el;
}
function rollGram() {
  const list = GRAMMAR.filter(g => g.bai <= upTo && g !== gram);
  gram = list[Math.floor(Math.random() * list.length)] || gram;
  const box = $("gram"); box.replaceChildren();
  if (!gram) return;
  box.append(segs(make("div", "gname"), gram.nameSeg), segs(make("div", "form"), gram.formSeg));
}

function clearPic() { pic = null; opened.clear(); $("frame").replaceChildren(Object.assign(make("div", "empty"), { innerHTML: "Bấm nút 聊<br>để rút một bức hình" })); renderHintBtns(); renderHints(); }
function updateCount() { const n = pool().length; $("count").textContent = pic ? `Hình ${n - deck.length}/${n} trong lượt rút` : `${n} hình trong phạm vi đã chọn`; }

function draw() {
  if (!deck.length) { deck = shuffle(pool().slice()); if (pic && deck.length > 1 && deck[deck.length - 1] === pic) deck.unshift(deck.pop()); }
  pic = deck.pop(); opened.clear();
  const img = make("img"); img.src = pic.img; img.alt = pic.alt;
  $("frame").replaceChildren(img);
  const d = $("dice"); d.classList.remove("spin"); void d.offsetWidth; d.classList.add("spin");
  renderHintBtns(); renderHints(); rollGram(); updateCount();
}

$("dice").onclick = draw;
$("regram").onclick = rollGram;
renderLessons(); draw();
</script>
