<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>window.STANDALONE=true</script>
</head>
<body>
<title>Khẩu ngữ cấp tốc Bài 7</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,700&family=Noto+Serif:wght@400;600&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
[hidden] { display: none !important }
/* Layout: the user's sketch. Dashed capsule of pinyin boxes on the left, green-framed lesson sheet on the right with two big corners. */
:root {
  --bg: #fbfdfb; --sheet: #ffffff; --ink: #1d2a24; --muted: #5d6e65; --line: #cddad2;
  --green: #14894a; --green-soft: #e3f4ea; --blue: #2f5a93; --orange: #d9700f; --orange-soft: #fdeedd;
  --on-green: #ffffff;
  --bad: #c0392b; --bad-soft: #f9e0dc;
  --menu-red: #8f2c25; --menu-gold: #b8860b; --menu-paper: #fdf8ee; --on-red: #ffffff;
  --body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --pinyin: "Noto Serif", Georgia, "Times New Roman", serif;
  --han: "Noto Serif SC", "Songti SC", "SimSun", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111815; --sheet: #17201c; --ink: #e6efe9; --muted: #9db0a5; --line: #33423a;
  --green: #4fce8a; --green-soft: #1d3a2b; --blue: #8db4e6; --orange: #f2a152; --orange-soft: #3c2a18;
  --on-green: #0d1a13; --bad: #f0806f; --bad-soft: #4a2520; --menu-red: #e58a7f; --menu-gold: #e0b84f; --menu-paper: #211a15; --on-red: #1d1410; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111815; --sheet: #17201c; --ink: #e6efe9; --muted: #9db0a5; --line: #33423a;
  --green: #4fce8a; --green-soft: #1d3a2b; --blue: #8db4e6; --orange: #f2a152; --orange-soft: #3c2a18;
  --on-green: #0d1a13; --bad: #f0806f; --bad-soft: #4a2520; --menu-red: #e58a7f; --menu-gold: #e0b84f; --menu-paper: #211a15; --on-red: #1d1410; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55 }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px }

.page { max-width: 1120px; margin-inline: auto; padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px }
h1 { margin: 0; font-size: 1.25rem; font-weight: 700 }
.topics { display: flex; flex-wrap: wrap; gap: 8px }
.topic { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: .9rem; font-weight: 500 }
.topic:hover { border-color: var(--green) }
.topic[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--on-green) }
.note { margin: 0; font-size: .85rem; color: var(--muted) }

.study { display: grid; grid-template-columns: 212px minmax(0, 1fr); gap: 24px; align-items: start }

.words { border: 1.5px dashed var(--blue); border-radius: 32px; padding: 16px 12px; display: grid; gap: 4px;
  position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 24px); overflow-y: auto }
.word { background: none; border: 1px solid transparent; border-radius: 10px; padding: 8px 12px; text-align: left;
  font-family: var(--pinyin); font-size: 1.1rem; line-height: 1.3; color: var(--ink) }
.word:hover { background: var(--green-soft) }
.word[aria-current="true"] { background: var(--green-soft); border-color: var(--green); color: var(--green); font-weight: 600 }

.sheet { background: var(--sheet); border: 1.5px solid var(--green); border-radius: 64px 2px 64px 2px;
  padding: 28px clamp(20px, 5vw, 56px) 32px; display: grid; gap: 24px; min-width: 0 }

.head { text-align: center; display: grid; gap: 2px }
.head .py { font-family: var(--pinyin); font-size: 1.05rem; color: var(--muted) }
.head .py span { font-family: var(--han); margin-left: .5em }
h2 { margin: 0; color: var(--green); font-size: clamp(1.5rem, 3.4vw, 2rem); font-weight: 700; font-style: italic; line-height: 1.25; text-wrap: balance }

.pic { width: 280px; max-width: 100%; aspect-ratio: 4 / 3; justify-self: center; border: 1px solid var(--line); border-radius: 4px;
  display: grid; place-items: center; overflow: hidden; color: var(--muted); font-size: .9rem; text-align: center; padding: 12px }
.pic.has { padding: 0 }
.pic img { width: 100%; height: 100%; object-fit: cover; display: block }

.block { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 16px; align-items: start }
.block h3 { margin: 0; padding-top: 7px; font-size: .9rem; font-weight: 700; font-style: italic; color: var(--green) }
.lines { display: grid; gap: 12px; list-style: none; margin: 0; padding: 0; min-width: 0 }
.line { display: grid; grid-template-columns: 16px 22px minmax(0, 1fr) auto; column-gap: 8px; align-items: start }
.tr .line { grid-template-columns: 16px minmax(0, 1fr) }
.arrow { color: var(--green); padding-top: 7px }
.arrow svg { display: block }
.num { font-family: var(--pinyin); font-size: 1.05rem; padding-top: 3px; font-variant-numeric: tabular-nums }
.bullet { padding-top: 4px; color: var(--muted) }
.body { min-width: 0; display: grid; gap: 4px; justify-items: start }
.sent { font-size: 1.05rem; padding-top: 3px }
.sent.pin { font-family: var(--pinyin) }
.sent mark, .ans mark { background: none; color: var(--green); font-weight: 600 }
.han { font-family: var(--han); color: var(--muted) }
.ans { font-family: var(--pinyin); border-left: 2px solid var(--green); padding-left: 10px; display: grid }

.show { background: none; border: 1px solid var(--green); color: var(--green); border-radius: 6px; padding: 4px 12px; font-size: .85rem; font-weight: 600 }
.show:hover { background: var(--green-soft) }

.say { width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--orange-soft); color: var(--orange); display: grid; place-items: center }
.say:hover:not(:disabled) { outline: 1px solid var(--orange) }
.say:disabled { opacity: .45; cursor: not-allowed }
.say.on { background: var(--orange); color: var(--sheet) }

.empty { color: var(--muted); margin: 0; padding-top: 5px; font-size: .95rem }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-top: 1px solid var(--line); padding-top: 16px; font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums }
.nav button { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; color: var(--ink) }
.nav button:hover:not(:disabled) { border-color: var(--green) }
.nav button:disabled { opacity: .4; cursor: default }

/* Online menu */
.menu { background: var(--menu-paper); border-block: 2px solid var(--menu-red); padding: 20px clamp(12px, 3vw, 28px); display: grid; gap: 20px; max-width: 640px; width: 100%; justify-self: center; min-width: 0 }
.mhead { justify-self: center; background: none; border: 0; padding: 4px 16px; color: var(--menu-red); font-family: var(--pinyin); font-size: clamp(2rem, 6vw, 2.8rem); line-height: 1.2 }
.mhint { margin: 0; text-align: center; font-size: .9rem; color: var(--muted) }
.mgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px }
.mgroup { grid-column: 1 / -1; display: grid; gap: 4px; min-width: 0 }
.mgroup.half { grid-column: auto }
.mchips { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding-bottom: 6px }
.mchip { border: 0; border-radius: 999px; padding: 4px 14px; background: var(--menu-red); color: var(--on-red); font-family: var(--pinyin); font-weight: 600 }
.mchip.gold { background: var(--menu-gold) }
.mrow { background: none; border: 0; border-radius: 6px; width: 100%; text-align: left; padding: 6px 8px; display: grid; grid-template-columns: minmax(0, auto) minmax(12px, 1fr) auto; column-gap: 8px; align-items: baseline }
.mrow:hover, .mhead:hover, .mrow.on { background: var(--orange-soft) }
.mchip:hover, .mchip.on { outline: 2px solid var(--orange); outline-offset: 1px }
.mhead.on { background: var(--orange-soft) }
.mname { font-family: var(--pinyin); font-weight: 600; font-size: 1.1rem; color: var(--ink) }
.mname span { font-family: var(--han); font-weight: 400; font-size: .9rem; color: var(--muted); margin-left: .4em }
.mdots { border-bottom: 2px dotted var(--menu-gold); transform: translateY(-4px) }
.mprice { color: var(--menu-red); font-weight: 700; font-variant-numeric: tabular-nums }
.mvi { grid-column: 1 / -1; font-size: .85rem; color: var(--muted) }
.dlrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px }
.dlnote { flex-basis: 100%; min-height: 1.3em; font-size: .9rem; color: var(--muted) }
.mstatus { min-height: 1.4em; margin: 0; text-align: center; font-size: .9rem; color: var(--muted) }

/* Video review */
.vstudy { display: grid; grid-template-columns: minmax(0, 250px) minmax(0, 1fr); gap: 28px; align-items: start }
.vside { display: grid; gap: 8px; position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)) }
.vbox { width: 100%; max-width: 100%; aspect-ratio: 9 / 16; display: block; background: var(--ink); border-radius: 6px }
.vsteps { display: grid; gap: 24px; min-width: 0 }
.step { display: grid; gap: 10px; min-width: 0 }
.step h3 { margin: 0; font-size: 1rem; font-weight: 700; color: var(--green) }
.step p { margin: 0 }
.q { display: grid; gap: 4px; justify-items: start; min-width: 0 }
.q .sent { font-family: var(--han); padding-top: 0 }
.tip { font-size: .9rem; color: var(--muted) }
.vline { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; align-items: start }
.who { font-size: .85rem; font-weight: 600; color: var(--muted) }
.jump { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: var(--green); text-decoration: underline; text-underline-offset: 3px }
.apic { width: 100% }
.abox { width: 100%; max-width: 100%; display: block }
.word.vid + .word.vid { margin-top: 4px }
.word.vid { font-family: var(--body); font-size: .95rem; font-weight: 600; color: var(--blue); border: 1px dashed var(--blue); margin-top: 8px }
.word.vid[aria-current="true"] { background: var(--green-soft); border: 1px solid var(--green); color: var(--green) }

/* Ngữ pháp và bài tập */
.ttl { display: grid; gap: 2px }
.word.item { font-family: var(--body); font-size: .95rem; line-height: 1.35 }
.sub { font-family: var(--han); color: var(--muted); font-size: 1.05rem }
.fx { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center }
.fx > span { display: grid; text-align: center; border: 1.5px solid var(--green); border-radius: 8px; padding: 6px 12px; min-width: 72px; background: var(--green-soft) }
.fx b { font-size: .78rem; font-weight: 600; color: var(--green); letter-spacing: .02em }
.fx i { font-style: normal; font-family: var(--han); font-size: 1.15rem }
.fxs { display: grid; gap: 10px }
.para { margin: 0; max-width: 65ch }
.gx { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start }
.gx .zh { font-family: var(--han); font-size: 1.1rem }
.gx .pin { font-family: var(--pinyin); color: var(--green) }
.notes { margin: 0; padding-left: 1.1em; display: grid; gap: 6px }
.wrong { display: grid; gap: 6px }
.wr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px }
.wr .no { font-family: var(--han); color: var(--bad); text-decoration: line-through }
.wr .ok { font-family: var(--han); color: var(--green) }
.wr .why { grid-column: 1 / -1; font-size: .85rem; color: var(--muted) }
.opts { display: flex; flex-wrap: wrap; gap: 8px }
.opt { background: var(--sheet); border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 14px; font-family: var(--han); font-size: 1.05rem }
.opt:hover:not(:disabled) { border-color: var(--green) }
.opt.right { background: var(--green-soft); border-color: var(--green) }
.opt.wrongpick { background: var(--bad-soft); border-color: var(--bad) }
.opt:disabled { cursor: default }
.fb { margin: 0; font-size: .92rem; min-height: 1.4em }
.fb.good { color: var(--green) } .fb.badc { color: var(--bad) }
.task { margin: 0; color: var(--muted) }
.task b { font-family: var(--han); color: var(--ink); font-weight: 600; margin-right: .4em }
.cards { display: grid; gap: 14px }
.pcard { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 16px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; align-items: start }
.pcard img { width: 100%; border-radius: 4px; display: block; background: #fff }
.pbody { display: grid; gap: 8px; min-width: 0 }
.prompt { font-family: var(--han); font-size: 1.05rem; margin: 0 }
.pbody textarea, .desc textarea { width: 100%; min-height: 64px; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--sheet); color: var(--ink); font: 1rem/1.45 var(--han); resize: vertical }
.pbody textarea:focus-visible, .desc textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px }
.alist { display: grid; gap: 6px; border-left: 2px solid var(--green); padding-left: 10px }
.fills, .orders, .mcs, .talks { display: grid; gap: 12px; list-style: none; margin: 0; padding: 0 }
.fillrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: var(--han); font-size: 1.15rem }
.slot { min-width: 2.2em; text-align: center; border-bottom: 2px solid var(--green); padding: 0 6px; color: var(--green); font-weight: 600 }
.slot.badc { color: var(--bad); border-color: var(--bad) }
.mini { display: flex; gap: 6px }
.mini .opt { padding: 4px 12px }
.subtxt { font-size: .9rem; color: var(--muted) }
.subtxt .pin { font-family: var(--pinyin); color: var(--green) }
.orow { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 8px }
.built { min-height: 46px; display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; border: 1.5px dashed var(--line); border-radius: 8px; align-items: center }
.built.good { border-style: solid; border-color: var(--green); background: var(--green-soft) }
.built.badc { border-style: solid; border-color: var(--bad); background: var(--bad-soft) }
.tok { font-family: var(--han); font-size: 1.05rem; padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--green); background: var(--sheet) }
.tok:disabled { opacity: .35; cursor: default; border-style: dashed }
.acts { display: flex; flex-wrap: wrap; gap: 8px }
.score { margin: 0; padding: 10px 14px; border-radius: 6px; background: var(--green-soft); font-weight: 600; font-variant-numeric: tabular-nums }
.bank { display: flex; flex-wrap: wrap; gap: 6px }
.bank .tok { display: grid; text-align: center; line-height: 1.2 }
.bank .tok small { font-family: var(--body); font-size: .72rem; color: var(--muted) }
.spotwrap { position: relative; max-width: 420px; width: 100%; justify-self: center }
.spotwrap img { width: 100%; display: block; border-radius: 6px; background: #fff }
.spot { position: absolute; border: 2px dashed var(--blue); border-radius: 10px; background: transparent }
.spot:hover { background: rgba(47, 90, 147, .12) }
.spot.right { border: 3px solid var(--green); background: rgba(20, 137, 74, .15) }
.spot.wrongpick { border: 3px solid var(--bad); background: rgba(192, 57, 43, .12) }
.spot span { position: absolute; left: 4px; top: 4px; background: var(--sheet); color: var(--ink); font-size: .75rem; padding: 0 6px; border-radius: 4px }
.tcard { display: grid; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: 8px }
.head.wh { gap: 0 }
.head.wh .hrow { display: flex; align-items: center; justify-content: center; gap: 12px }
.head.wh .bigpy { font-family: var(--pinyin); font-size: clamp(1.6rem, 3.6vw, 2rem); font-weight: 600; color: var(--ink); line-height: 1.25 }
.head.wh .bighan { font-family: var(--han); font-size: clamp(1.45rem, 3.2vw, 1.8rem); color: var(--ink); line-height: 1.3 }
.head.wh h2 { font-size: clamp(1.15rem, 2.4vw, 1.4rem); margin-top: 6px }
.sent.pin { font-size: 1.12rem }
.body .han, .ans .han { font-size: 1.02rem }
.zp { display: inline-grid; justify-items: inherit; line-height: 1.3 }
.zp .p { font-family: var(--pinyin); font-size: 1.1em; color: var(--green) }
.zp .h { font-family: var(--han); font-size: 1em }
.head .zp { justify-items: center; font-size: 1.05rem }
.head .zp .p { color: var(--muted) } .head .zp .h { color: var(--muted) }
.fx i { display: grid; font-size: 1.05rem }
.fx i .p { font-size: 1.08em }
.gx .pin { font-size: 1.12rem; order: -1 }
.gx .zh { font-size: 1.04rem }
.gx .txt { display: grid; gap: 1px }
.wr .no, .wr .ok { display: grid }
.wr .no .p, .wr .ok .p { color: inherit; text-decoration: inherit }
.opt { display: grid; text-align: left; gap: 1px; font-family: var(--han) }
.opt .p { font-family: var(--pinyin); font-size: 1.06em; color: var(--green) }
.tok { display: inline-grid; text-align: center; line-height: 1.25; border-radius: 10px !important }
.tok .p { font-family: var(--pinyin); font-size: 1.04em; color: var(--green) }
.fillrow { align-items: end; font-size: 1.05rem }
.fillrow .slot { align-self: end }
.prompt { display: grid; gap: 1px }
.prompt .p { font-family: var(--pinyin); font-size: 1.08em; color: var(--green) }
.task .zp { margin-right: .5em }
.task b { display: none }
.ph { width: 100%; aspect-ratio: 4 / 3; max-width: 100%; border: 1.5px dashed var(--line); border-radius: 6px; display: grid; place-items: center; color: var(--muted); font-size: .9rem; text-align: center; padding: 10px; background: var(--bg) }
.spotwrap .ph { border-style: solid }
/* Bài khóa như trong sách */
.kw { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none }
.kwl { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr); gap: 4px 16px; padding: 8px 10px; border-radius: 8px; border-left: 3px solid transparent; cursor: pointer }
.kwl:hover { background: var(--green-soft) }
.kwl.now { background: var(--orange-soft); border-left-color: var(--orange) }
.kwl:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px }
.kwho { display: grid; justify-items: end; text-align: right; align-content: start; padding-top: 2px }
.kwho .p { font-family: var(--pinyin); font-size: .9rem; color: var(--muted) }
.kwho .h { font-family: var(--han); font-weight: 600; font-size: 1.05rem }
.kwt { display: grid; gap: 1px; min-width: 0 }
.kwt .p { font-family: var(--pinyin); font-size: 1.16rem; color: var(--green) }
.kwt .p mark { background: none; color: var(--green); font-weight: 700 }
.kwt .h { font-family: var(--han); font-size: 1.08rem; letter-spacing: .02em }
.kwt .v { font-size: .9rem; color: var(--muted) }
.kwbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.tcard h4 { margin: 0; font-size: .9rem; color: var(--green) }
.lines > .show, .alist + .show, .pbody > .show, .tcard > .show { justify-self: start }

@media (max-width: 760px) {
  .pcard { grid-template-columns: minmax(0, 1fr) }
  .pcard img { max-width: 320px }
  .wr { grid-template-columns: minmax(0, 1fr) }
  .kwl { grid-template-columns: minmax(0, 1fr) }
  .kwho { justify-items: start; text-align: left; display: flex; gap: 6px; align-items: baseline }
  .vstudy { grid-template-columns: minmax(0, 1fr) }
  .vside { position: static; justify-items: center }
  .vbox { width: min(250px, 100%) }
  .mgrid { grid-template-columns: minmax(0, 1fr) }
  .abox, .apic { width: min(320px, 100%) }
  .word.vid + .word.vid { margin-top: 0 }
  .word.vid { margin-top: 0 }
  .study { grid-template-columns: minmax(0, 1fr); gap: 16px }
  .words { position: static; max-height: none; display: flex; overflow-x: auto; overflow-y: hidden; border-radius: 20px; padding: 8px }
  .word { flex: none; white-space: nowrap }
  .sheet { border-radius: 40px 2px 40px 2px; padding-inline: 16px }
  .block { grid-template-columns: minmax(0, 1fr); gap: 8px }
  .block h3 { padding-top: 0 }
}
@media (prefers-reduced-motion: no-preference) { .word, .topic, .show { transition: background-color .12s } }

.liao { position: fixed; right: max(18px, env(safe-area-inset-right, 0px)); bottom: max(18px, env(safe-area-inset-bottom, 0px)); z-index: 50;
  width: 84px; height: 84px; border-radius: 50%; background: var(--orange); color: var(--sheet); text-decoration: none;
  display: grid; place-content: center; text-align: center; line-height: 1.05; border: 3px solid var(--sheet);
  box-shadow: 0 8px 20px -6px rgba(0,0,0,.45), 0 0 0 2px var(--orange) }

:"Wǒ jiějie tóufa tǐng [cháng] de.","han":"我姐姐头发挺长的。"},{"vi":"Tóc của Lily có [dài] không?","py":"Lìli tóufa [cháng] bu [cháng]?","han":"莉莉头发长不长？"}],"audio":"media/B07-BS-02.mp3"},{"id":"B07-BS-03","py":"yǎnjing","han":"眼睛","vi":"mắt","type":"danh từ","image":"media/B07-02.jpg","ex":[{"py":"Bǎoluó [yǎnjing] bǐjiào dà.","han":"保罗眼睛比较大。","audio":"media/B07-BS-03_1.mp3"},{"py":"Tā de [yǎnjing] fēicháng piàoliang.","han":"她的眼睛非常漂亮。","audio":"media/B07-BS-03_2.mp3"}],"tr":[{"vi":"[Mắt] con gái chị ấy rất to.","py":"Tā nǚ'ér [yǎnjing] hěn dà.","han":"她女儿眼睛很大。"},{"vi":"[Mắt] bạn cùng phòng tôi khá to.","py":"Wǒ tóngwū [yǎnjing] bǐjiào dà.","han":"我同屋眼睛比较大。"}],"audio":"media/B07-BS-03.mp3"},{"id":"B07-BS-04","py":"gèzi","han":"个子","vi":"vóc dáng, chiều cao","type":"danh từ","image":"media/B07-17.jpg","ex":[{"py":"Tā [gèzi] hěn gāo.","han":"他个子很高。","audio":"media/B07-BS-04_1.mp3"},{"py":"Wǒ [gèzi] bú tài gāo.","han":"我个子不太高。","audio":"media/B07-BS-04_2.mp3"}],"tr":[{"vi":"[Dáng] bạn cùng phòng tôi rất cao.","py":"Wǒ tóngwū [gèzi] fēicháng gāo.","han":"我同屋个子非常高。"},{"vi":"[Vóc dáng] anh trai bạn có cao không?","py":"Nǐ gēge [gèzi] gāo bu gāo?","han":"你哥哥个子高不高？"}],"audio":"media/B07-BS-04.mp3"},{"id":"B07-BS-05","py":"gāo","han":"高","vi":"cao","type":"tính từ","image":"media/B07-11.jpg","ex":[{"py":"Bǎoluó gèzi hěn [gāo].","han":"保罗个子很高。","audio":"media/B07-BS-05_1.mp3"},{"py":"Nǐ gèzi [gāo] ma?","han":"你个子高吗？","audio":"media/B07-BS-05_2.mp3"}],"tr":[{"vi":"Thầy giáo chúng tôi rất [cao].","py":"Wǒmen lǎoshī gèzi hěn [gāo].","han":"我们老师个子很高。"},{"vi":"Thành tích của anh ấy rất [cao].","py":"Tā de chéngjì hěn [gāo].","han":"他的成绩很高。"}],"audio":"media/B07-BS-05.mp3"},{"id":"B07-BS-06","py":"diànshì","han":"电视","vi":"ti vi","type":"danh từ","image":"media/B07-09.jpg","ex":[{"py":"Sùshè li yǒu [diànshì] ma?","han":"宿舍里有电视吗？","audio":"media/B07-BS-06_1.mp3"},{"py":"Wǒ de sùshè li méiyǒu [diànshì].","han":"我的宿舍里没有电视。","audio":"media/B07-BS-06_2.mp3"}],"tr":[{"vi":"Nhà ăn có [ti vi].","py":"Shítáng li yǒu [diànshì].","han":"食堂里有电视。"},{"vi":"[Ti vi] ở ký túc xá không tốt lắm.","py":"Sùshè de [diànshì] bú tài hǎo.","han":"宿舍的电视不太好。"}],"audio":"media/B07-BS-06.mp3"},{"id":"B07-BS-07","py":"Zhōngguó","han":"中国","vi":"Trung Quốc","type":"danh từ riêng","image":"media/B07-01.jpg","ex":[{"py":"Tā shì wǒ de [Zhōngguó] péngyou.","han":"他是我的中国朋友。","audio":"media/B07-BS-07_1.mp3"},{"py":"Tā de [Zhōngguó] péngyou hěn shuài.","han":"他的中国朋友很帅。","audio":"media/B07-BS-07_2.mp3"}],"tr":[{"vi":"Tôi có một người bạn [Trung Quốc].","py":"Wǒ yǒu yí ge [Zhōngguó] péngyou.","han":"我有一个中国朋友。"},{"vi":"Bạn cùng phòng tôi là người [Trung Quốc].","py":"Wǒ tóngwū shì [Zhōngguó] rén.","han":"我同屋是中国人。"}],"audio":"media/B07-BS-07.mp3"},{"id":"B07-BS-08","py":"Lìli","han":"莉莉","vi":"Lily (tên người)","type":"danh từ riêng","image":"media/B07-18.jpg","ex":[{"py":"[Lìli] shì wǒ de tóngxué.","han":"莉莉是我的同学。","audio":"media/B07-BS-08_1.mp3"},{"py":"[Lìli] méiyǒu jiějie.","han":"莉莉没有姐姐。","audio":"media/B07-BS-08_2.mp3"}],"tr":[{"vi":"[Lily] học rất chăm.","py":"[Lìli] xuéxí hěn nǔlì.","han":"莉莉学习很努力。"},{"vi":"[Lily] có bạn cùng phòng không?","py":"[Lìli] yǒu tóngwū ma?","han":"莉莉有同屋吗？"}],"audio":"media/B07-BS-08.mp3"}]},{"name":"Ngữ pháp","kind":"grammar","items":[{"id":"G1","label":"1. 主谓谓语句","zh":"主谓谓语句","title":"Câu vị ngữ chủ vị","formula":[[["Chủ ngữ","我","wǒ"],["Chủ ngữ nhỏ","身体","shēntǐ"],["(不/很) + Tính từ","很好","hěn hǎo"]]],"explain":["Vị ngữ của câu là một cụm chủ – vị. Chủ ngữ lớn thường là người hoặc nơi chốn, chủ ngữ nhỏ là một mặt của nó: sức khỏe, việc học, thành tích, tóc, mắt...","Phủ định: đặt 不 trước vị ngữ nhỏ, không đặt trước cả cụm."],"examples":[{"han":"我身体很好。","py":"Wǒ shēntǐ hěn hǎo.","vi":"Tôi rất khỏe."},{"han":"他学习不太努力。","py":"Tā xuéxí bú tài nǔlì.","vi":"Anh ấy học không chăm lắm."},{"han":"我们学校留学生挺多的。","py":"Wǒmen xuéxiào liúxuéshēng tǐng duō de.","vi":"Trường chúng tôi khá nhiều du học sinh."},{"han":"莉莉头发很长。","py":"Lìli tóufa hěn cháng.","vi":"Tóc Lily rất dài."}],"notes":["我身体很好 và 我的身体很好 nghĩa gần như nhau, nhưng câu không có 的 thông dụng hơn trong khẩu ngữ.","Tính từ làm vị ngữ thường có 很 đi kèm. 很 ở đây đọc nhẹ, nghĩa \"rất\" rất mờ. Nói 我身体好 không có 很 nghe như đang so sánh."],"wrong":[["不我身体好。","我身体不好。","不 đứng trước vị ngữ nhỏ","Bù wǒ shēntǐ hǎo.","Wǒ shēntǐ bù hǎo."],["我很身体好。","我身体很好。","很 đứng ngay trước tính từ","Wǒ hěn shēntǐ hǎo.","Wǒ shēntǐ hěn hǎo."],["我身体是很好。","我身体很好。","Không dùng 是 trước tính từ","Wǒ shēntǐ shì hěn hǎo.","Wǒ shēntǐ hěn hǎo."]],"check":[{"q":"Câu nào đúng?","opts":["我身体不太好。","我不身体太好。","我身体是不太好。"],"ans":0,"why":"不太 đứng ngay trước tính từ 好, không dùng 是.","optsPy":["Wǒ shēntǐ bú tài hǎo.","Wǒ bù shēntǐ tài hǎo.","Wǒ shēntǐ shì bú tài hǎo."]},{"q":"Nói \"Anh ấy học rất bận\" thế nào cho tự nhiên?","opts":["他学习很忙。","他的学习是很忙。","他很学习忙。"],"ans":0,"why":"Chủ ngữ lớn 他 + chủ ngữ nhỏ 学习 + 很忙.","optsPy":["Tā xuéxí hěn máng.","Tā de xuéxí shì hěn máng.","Tā hěn xuéxí máng."]}],"zhPy":"Zhǔwèi wèiyǔjù"},{"id":"G2","label":"2. Câu hỏi với 吗","zh":"疑问句（1）","title":"Câu hỏi với 吗","formula":[[["Câu trần thuật","你学习努力","nǐ xuéxí nǔlì"],["吗？","吗？","ma?"]]],"explain":["Thêm trợ từ 吗 vào cuối câu trần thuật để tạo câu hỏi có hoặc không. 吗 đọc thanh nhẹ, giọng hơi lên cuối câu.","Trả lời bằng cách lặp lại động từ hoặc tính từ chính; phủ định thì thêm 不 hoặc 没."],"examples":[{"han":"你们是留学生吗？——是，我们是留学生。","py":"Nǐmen shì liúxuéshēng ma? — Shì, wǒmen shì liúxuéshēng.","vi":"Các bạn là du học sinh à? – Vâng, chúng tôi là du học sinh."},{"han":"你学习努力吗？","py":"Nǐ xuéxí nǔlì ma?","vi":"Bạn học có chăm không?"},{"han":"她漂亮吗？","py":"Tā piàoliang ma?","vi":"Cô ấy có đẹp không?"},{"han":"最近你身体好吗？——很好。","py":"Zuìjìn nǐ shēntǐ hǎo ma? — Hěn hǎo.","vi":"Dạo này bạn khỏe không? – Rất khỏe."}],"notes":["Câu đã có từ để hỏi (怎么样, 什么, 哪儿...) hoặc đã là câu chính phản thì không thêm 吗."],"wrong":[["你们学校食堂怎么样吗？","你们学校食堂怎么样？","Đã có 怎么样 thì bỏ 吗","Nǐmen xuéxiào shítáng zěnmeyàng ma?","Nǐmen xuéxiào shítáng zěnmeyàng?"],["你忙不忙吗？","你忙不忙？ / 你忙吗？","Câu chính phản không thêm 吗","Nǐ máng bu máng ma?","Nǐ máng bu máng? / Nǐ máng ma?"]],"check":[{"q":"Hỏi \"Bạn có bạn cùng phòng không?\"","opts":["你有同屋吗？","你吗有同屋？","吗你有同屋？"],"ans":0,"why":"吗 luôn đứng cuối câu.","optsPy":["Nǐ yǒu tóngwū ma?","Nǐ ma yǒu tóngwū?","Ma nǐ yǒu tóngwū?"]},{"q":"Câu nào sai?","opts":["她漂亮吗？","你学习努力吗？","你的宿舍怎么样吗？"],"ans":2,"why":"Đã có 怎么样 thì không thêm 吗.","optsPy":["Tā piàoliang ma?","Nǐ xuéxí nǔlì ma?","Nǐ de sùshè zěnmeyàng ma?"]}],"zhPy":"Yíwènjù (1)"},{"id":"G3","label":"3. Câu hỏi chính phản","zh":"正反疑问句","title":"Câu hỏi chính phản","formula":[[["Chủ ngữ","你的宿舍","nǐ de sùshè"],["V / A","大","dà"],["不","不","bù"],["V / A","大？","dà?"]],[["Chủ ngữ","你","nǐ"],["有","有","yǒu"],["没","没","méi"],["有 + tân ngữ","有同屋？","yǒu tóngwū?"]]],"explain":["Ghép dạng khẳng định và phủ định của động từ hoặc tính từ chính trong câu. Tác dụng giống câu hỏi với 吗.","不 ở giữa đọc thanh nhẹ: dà bu dà. Từ hai âm tiết lặp cả từ: 努力不努力 (khẩu ngữ còn nói 努不努力).","Với 有, dạng chính phản là 有没有."],"examples":[{"han":"你的宿舍大不大？","py":"Nǐ de sùshè dà bu dà?","vi":"Ký túc xá của bạn có lớn không?"},{"han":"你去不去教室？","py":"Nǐ qù bu qù jiàoshì?","vi":"Bạn có đi đến lớp không?"},{"han":"他学习努力不努力？","py":"Tā xuéxí nǔlì bu nǔlì?","vi":"Anh ấy học có chăm không?"},{"han":"你们学校留学生多不多？","py":"Nǐmen xuéxiào liúxuéshēng duō bu duō?","vi":"Trường các bạn có nhiều du học sinh không?"}],"notes":["Câu chính phản không dùng 很, 非常, 比较... trước tính từ."],"wrong":[["你忙不忙吗？","你忙不忙？","Không thêm 吗","Nǐ máng bu máng ma?","Nǐ máng bu máng?"],["你很忙不忙？","你忙不忙？","Không dùng 很","Nǐ hěn máng bu máng?","Nǐ máng bu máng?"],["你有不有同屋？","你有没有同屋？","Phủ định của 有 là 没","Nǐ yǒu bu yǒu tóngwū?","Nǐ yǒu méiyǒu tóngwū?"]],"check":[{"q":"Chuyển 你的宿舍远吗？ thành câu chính phản","opts":["你的宿舍远不远？","你的宿舍不远远？","你的宿舍很远不远？"],"ans":0,"why":"Khẳng định + 不 + khẳng định, không dùng 很.","optsPy":["Nǐ de sùshè yuǎn bu yuǎn?","Nǐ de sùshè bù yuǎnyuǎn?","Nǐ de sùshè hěn yuǎn bu yuǎn?"]},{"q":"Hỏi \"Lớp const SPEAKER = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const ARROW = '<svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true"><path d="M0 4h9V0l7 6-7 6V8H0z"/></svg>';

const $ = id => document.getElementById(id);
const make = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
/* Biến "a [b] c" thành chữ thường và thẻ mark, luôn dùng textContent để an toàn. */
function marked(el, text) {
  text.split(/(\[[^\]]*\])/).forEach(p => {
    if (/^\[.*\]$/.test(p)) el.append(make("mark", "", p.slice(1, -1))); else if (p) el.append(p);
  });
  return el;
}

let topicIdx = 0, wordIdx = 0, player = null, view = "word", videoIdx = 0, videoStop = null;

function stopAudio() { try { window.speechSynthesis?.cancel(); } catch (e) {} document.querySelectorAll(".mrow.on, .mchip.on, .mhead.on").forEach(b => b.classList.remove("on")); if (player) { player.pause(); player = null; } document.querySelectorAll(".say.on").forEach(b => b.classList.remove("on")); }

function revealButton(content, showText = "Hiển thị") {
  const b = make("button", "show", showText);
  b.type = "button"; b.setAttribute("aria-expanded", "false");
  content.hidden = true;
  b.onclick = () => {
    content.hidden = !content.hidden;
    b.textContent = content.hidden ? showText : "Ẩn";
    b.setAttribute("aria-expanded", String(!content.hidden));
  };
  return b;
}

function speaker(src, han) {
  const b = make("button", "say");
  b.type = "button"; b.innerHTML = SPEAKER;
  if (!src && han) { b.setAttribute("aria-label", "Nghe"); b.onclick = () => sayZh(han, b); return b; }
  if (!src) { b.disabled = true; b.title = "Chưa có file nghe"; b.setAttribute("aria-label", "Chưa có file nghe"); return b; }
  b.setAttribute("aria-label", "Nghe câu ví dụ");
  b.onclick = () => {
    const wasOn = b.classList.contains("on");
    stopAudio();
    if (wasOn) return;
    player = new Audio(src);
    b.classList.add("on");
    player.onended = player.onerror = () => b.classList.remove("on");
    player.play().catch(() => b.classList.remove("on"));
  };
  return b;
}

function exampleLine(item, i) {
  const li = make("li", "line");
  const arrow = make("span", "arrow"); arrow.innerHTML = ARROW;
  const body = make("div", "body");
  const text = make("div");
  text.append(marked(make("div", "sent pin"), item.py));
  if (item.han) text.append(make("div", "han", item.han));
  body.append(revealButton(text), text);
  li.append(arrow, make("span", "num", (i + 1) + ","), body, speaker(item.audio, item.han));
  return li;
}

function translateLine(item) {
  const li = make("li", "line");
  const body = make("div", "body");
  const ans = make("div", "ans");
  ans.append(marked(make("span"), item.py));
  if (item.han) ans.append(make("span", "han", item.han));
  body.append(marked(make("div", "sent"), item.vi), revealButton(ans, "Hiển thị đáp án"), ans);
  li.append(make("span", "bullet", "•"), body);
  return li;
}

function block(title, items, render, cls, emptyText) {
  const sec = make("section", "block " + cls);
  sec.append(make("h3", "", title));
  if (items.length) { const ul = make("ul", "lines"); items.forEach((it, i) => ul.append(render(it, i))); sec.append(ul); }
  else sec.append(make("p", "empty", emptyText));
  return sec;
}

function renderSheet() {
  stopAudio();
  const sheet = $("sheet"), topic = TOPICS[topicIdx], list = topic.words || topic.items, word = list[wordIdx];
  sheet.replaceChildren();
  if (topic.kind) {
    if (topic.kind === "grammar") renderGrammar(sheet, word); else renderExercise(sheet, word);
    sheet.append(listNav(topic, list));
    return;
  }
  if (view === "video") {
    const item = topic.videos[videoIdx];
    if (item.kind === "menu") renderMenu(sheet, item, topic); else if (item.kind === "audio") renderText(sheet, item, topic); else renderVideo(sheet, item, topic);
    return;
  }
  if (!word) { sheet.append(make("p", "empty", "Chủ đề này chưa có từ vựng.")); return; }

  const head = make("header", "head wh");
  head.append(make("div", "bigpy", word.py));
  if (word.han) { const hz = make("div", "bighan", word.han); hz.lang = "zh-CN"; const hr = make("div", "hrow"); const sp = speaker(word.audio, word.han); sp.setAttribute("aria-label", "Nghe từ " + word.han); hr.append(hz, sp); head.append(hr); }
  head.append(make("h2", "", `${word.vi} (${word.type})`));

  const pic = make("div", "pic");
  if (word.image) { const img = make("img"); img.src = word.image; img.alt = word.vi; pic.classList.add("has"); pic.append(img); }
  else pic.textContent = "Hình ảnh sẽ được thêm sau";

  const nav = make("footer", "nav");
  const prev = make("button", "", "← Từ trước"), next = make("button", "", "Từ sau →");
  prev.type = next.type = "button";
  const last = wordIdx === list.length - 1;
  const nt = TOPICS[topicIdx + 1];
  if (last) next.textContent = topic.videos ? `${topic.videos[0].label} →` : nt ? `${nt.name} →` : "Từ sau →";
  prev.disabled = wordIdx === 0; next.disabled = last && !topic.videos && !nt;
  prev.onclick = () => pick(wordIdx - 1); next.onclick = () => last ? (topic.videos ? showVideo(0) : goTopic(topicIdx + 1)) : pick(wordIdx + 1);
  nav.append(prev, make("span", "", `${wordIdx + 1} / ${list.length}`), next);

  sheet.append(head, pic,
    block("Ví dụ", word.ex, exampleLine, "ex", "Từ này chưa có câu ví dụ."),
    block("Luyện dịch", word.tr, translateLine, "tr", "Từ này chưa có câu luyện dịch."),
    nav);
}

/* Mục video: 1 xem không phụ đề, 2 trả lời câu hỏi, 3 xem lại lời thoại */
function linkedText(el, text, links) {
  text.split(/(\[[^\]]*\])/).forEach(p => {
    const inner = /^\[.*\]$/.test(p) ? p.slice(1, -1) : null;
    if (inner === null) { if (p) el.append(p); return; }
    const id = links[inner];
    if (!id) { el.append(make("mark", "", inner)); return; }
    const b = make("button", "jump", inner);
    b.type = "button"; b.title = "Xem lại từ này";
    b.onclick = () => pick(TOPICS[topicIdx].words.findIndex(x => x.id === id));
    el.append(b);
  });
  return el;
}

/* Tải về: trong trang Claude dùng quyền tải của trình xem, bản sao mở từ máy thì tải trực tiếp */
const LOCAL = window.STANDALONE === true;
const dlReady = LOCAL ? Promise.resolve(true) : (window.claude?.use ? window.claude.use("downloads") : Promise.resolve(null));

function scriptText(v) {
  const clean = t => t.replace(/[\[\]]/g, "");
  const body = v.lines.map(l => `${l.who}: ${l.han}\n${clean(l.py)}\n${l.vi}`).join("\n\n");
  return `\ufeff${v.title}\n\n${body}\n`;
}

async function download(filename, source, note) {
  note.textContent = "";
  if (LOCAL) {
    const a = document.createElement("a");
    a.download = filename;
    a.href = typeof source === "string" && source.startsWith("media/") ? source : URL.createObjectURL(new Blob([source], { type: "text/plain;charset=utf-8" }));
    a.click();
    return;
  }
  try {
    const d = await dlReady;
    let data = source;
    if (source.startsWith("media/")) {
      note.textContent = "Đang chuẩn bị file...";
      const res = await fetch(source);
      if (!res.ok) throw { code: "fetch" };
      data = await res.blob();
    }
    note.textContent = "";
    await d.save({ filename, data });
    note.textContent = `Đã tải ${filename}.`;
  } catch (e) {
    note.textContent = e?.code === "declined" ? "" : e?.code === "rate_limited"
      ? "Đang có một yêu cầu tải khác, bạn thử lại sau giây lát."
      : "Chưa tải được file. Bạn thử lại sau.";
  }
}

function downloadRow(v) {
  const row = make("section", "step");
  row.hidden = true;
  const box = make("div", "dlrow");
  const note = make("span", "dlnote"); note.setAttribute("aria-live", "polite");
  const audio = make("button", "show", `Tải file nghe (.${v.ext || "mp4"})`);
  const script = make("button", "show", "Tải lời thoại (.txt)");
  audio.type = script.type = "button";
  audio.onclick = () => download(`${v.dl}.${v.ext || "mp4"}`, `media/${v.dl}.${v.ext || "mp4"}`, note);
  script.onclick = () => download(`${v.dl}-loi-thoai.txt`, scriptText(v), note);
  box.append(audio, script, note);
  row.append(make("h3", "", "Tải về máy"), box);
  dlReady.then(d => { row.hidden = !d; });
  return row;
}

function renderVideo(sheet, v, topic) {
  const head = make("header", "head");
  head.append(make("h2", "", v.title));

  const isAudio = v.kind === "audio", tts = !v.src;
  const video = make(isAudio ? "audio" : "video", isAudio ? "abox" : "vbox");
  video.controls = true; video.preload = "metadata"; video.src = v.src;
  if (!isAudio) { video.setAttribute("playsinline", ""); video.poster = v.poster; }
  const seg = () => { if (videoStop != null && video.currentTime >= videoStop) { video.pause(); videoStop = null; } };

  const ls = make("ul", "lines");
  v.lines.forEach(l => {

    const body = make("div", "body");

      body.append(revealButton(text), text);

    const say = make("button", "say");

    say.onclick = tts ? () => sayZh(l.han, say) : () => { video.dataset.seg = "1"; video.currentTime = l.start; videoStop = l.end; video.play().catch(() => {}); };
    li.append(body, say);

  s3.append(ls);

  const steps = make("div", "vsteps"); steps.append(s1, s2, s3); if (!tts) steps.append(downloadRow(v));

function itemNav(topic) {

/* Thực đơn: có file ghi âm thì phát file, chưa có thì nhờ giọng đọc tiếng Trung của thiết bị */
function speak(item, btn, status) {
  stopAudio();
  status.textContent = "";
  btn.classList.add("on");
  const done = () => btn.classList.remove("on");
  if (item.audio) {
    player = new Audio(item.audio);
    player.onended = player.onerror = done;
    player.play().catch(done);
    return;
  }
  const synth = window.speechSynthesis, voices = synth?.getVoices() || [];
  if (!synth || (voices.length && !voices.some(v => /^zh/i.test(v.lang)))) {
    done(); status.textContent = "Thiết bị này chưa có giọng đọc tiếng Trung."; return;
  }
  const u = new SpeechSynthesisUtterance(item.han);
  u.lang = "zh-CN"; u.rate = 0.85; u.onend = u.onerror = done;
  synth.speak(u);
}

/* Giọng máy tiếng Trung, dùng khi chưa có file ghi âm */
function zhVoiceMissing() {
  const s = window.speechSynthesis, v = s?.getVoices() || [];
  return !s || (v.length && !v.some(x => /^(zh|cmn)/i.test(x.lang)));
}
function noVoice() { $("tts").textContent = "Thiết bị này chưa có giọng đọc tiếng Trung nên chưa phát được. File ghi âm sẽ được thêm sau."; }
function zhKey(t) { return (t || "").replace(/[^\u4e00-\u9fff]/g, ""); }
function sayZh(text, btn) {
  const wasOn = btn?.classList.contains("on");
  stopAudio();
  if (wasOn) return;
  if (zhVoiceMissing()) return noVoice();
  const src = AUD[zhKey(text)];
  if (src) {
    btn?.classList.add("on");
    player = new Audio(src);
    player.onended = player.onerror = () => btn?.classList.remove("on");
    player.play().catch(() => btn?.classList.remove("on"));
    return;
  }
  btn?.classList.add("on");
  const u = new SpeechSynthesisUtterance(text.replace(/[_＿]+/g, ""));
  u.lang = "zh-CN"; u.rate = 0.85; u.onend = u.onerror = () => btn?.classList.remove("on");
  speechSynthesis.speak(u);
}
function sayAll(list, btn) {
  stopAudio();
  if (zhVoiceMissing()) return noVoice();
  btn.classList.add("on");
  list.forEach((t, i) => {
    const u = new SpeechSynthesisUtterance(t); u.lang = "zh-CN"; u.rate = 0.85;
    if (i === list.length - 1) u.onend = u.onerror = () => btn.classList.remove("on");
    speechSynthesis.speak(u);
  });
}

function zp(han, py, cls = "zp") {
  const s = make("span", cls); s.lang = "zh-CN";
  if (py) { const p = make("span", "p", py); p.lang = "zh-Latn-pinyin"; s.append(p); }
  s.append(make("span", "h", han));
  return s;
}
function ph(text = "Hình sẽ được thêm sau") { return make("div", "ph", text); }
function listNav(topic, list) {
  const nav = make("footer", "nav");
  const prev = make("button", "", "← Mục trước"), next = make("button", "", "Mục sau →");
  prev.type = next.type = "button";
  const last = wordIdx === list.length - 1, nt = TOPICS[topicIdx + 1];
  if (last && nt) next.textContent = `${nt.name} →`;
  prev.disabled = wordIdx === 0; next.disabled = last && !nt;
  prev.onclick = () => pick(wordIdx - 1); next.onclick = () => last ? goTopic(topicIdx + 1) : pick(wordIdx + 1);
  nav.append(prev, make("span", "", `${wordIdx + 1} / ${list.length}`), next);
  return nav;
}

function scoreBox(total) {
  const p = make("p", "score"); p.hidden = true;
  let right = 0, done = 0;
  return { el: p, mark(ok) { done++; if (ok) right++; if (done === total) { p.hidden = false; p.textContent = `Hoàn thành: ${right}/${total} câu đúng ngay lần đầu.`; } } };
}

function shuffled(n) {
  const a = [...Array(n).keys()];
  for (let k = 0; k < 20; k++) { for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } if (a.some((v, i) => v !== i)) break; }
  return a;
}
function exOrder(sheet, ex) {
  const ol = make("ol", "orders"), sc = scoreBox(ex.items.length);
  ex.items.forEach(it => {
    const li = make("li", "orow");
    const built = make("div", "built"), bank = make("div", "acts"), fb = make("p", "fb"), info = make("div", "subtxt");
    info.hidden = true;
    let picked = [], first = true, done = false;
    const order = shuffled(it.t.length);
    const tokBtns = order.map(i => {
      const b = make("button", "tok"); b.type = "button"; b.append(zp(it.t[i], it.tPy[i]));
      b.onclick = () => { if (done) return; picked.push(i); b.disabled = true; paint(); };
      return b;
    });
    function paint() {
      built.replaceChildren(...picked.map((i, k) => {
        const b = make("button", "tok"); b.type = "button"; b.append(zp(it.t[i], it.tPy[i])); b.title = "Bấm để bỏ";
        b.onclick = () => { if (done) return; picked.splice(k, 1); tokBtns[order.indexOf(i)].disabled = false; built.className = "built"; fb.textContent = ""; paint(); };
        return b;
      }));
      if (!picked.length) built.append(make("span", "tip", "Bấm các từ bên dưới theo thứ tự"));
    }
    const check = make("button", "show", "Kiểm tra"); check.type = "button";
    check.onclick = () => {
      if (done || picked.length < it.t.length) { fb.className = "fb badc"; fb.textContent = "Bạn hãy dùng hết các từ."; return; }
      const s = picked.map(i => it.t[i]).join("");
      if (it.ans.includes(s)) {
        done = true; built.className = "built good"; fb.className = "fb good"; fb.textContent = "Chính xác.";
        info.hidden = false; info.replaceChildren(make("span", "pin", it.py), " · ", it.vi, " ", speaker("", it.han)); sc.mark(first);
      } else { first = false; built.className = "built badc"; fb.className = "fb badc"; fb.textContent = "Chưa đúng. Bấm vào từ ở khung trên để bỏ rồi sắp lại."; }
    };
    bank.append(...tokBtns);
    paint();
    const acts = make("div", "acts"); acts.append(check);
    li.append(built, bank, acts, fb, info); ol.append(li);
  });
  sheet.append(ol, sc.el);
}

  if (ex.audio) { play = make("audio", "abox"); play.controls = true; play.preload = "metadata"; play.src = ex.audio; }
  else { play = make("button", "show", "▶ Nghe đoạn văn"); play.type = "button"; play.onclick = () => sayAll(ex.script.map(e => e.han), play); }
  const words = make("div", "bank"); ex.newwords.forEach(w => { const b = make("button", "tok"); b.type = "button"; b.append(zp(w.han, w.py), make("small", "", w.vi)); b.onclick = () => sayZh(w.han, b); words.append(b); });
  sheet.append(sec("Bước 1. Nghe", play, make("p", "tip", "Từ mới trong bài nghe:"), words));
  const wrap = make("div", "spotwrap");
  if (ex.img) { const img = make("img"); img.src = ex.img; img.alt = ex.alt; wrap.append(img); } else wrap.append(ph(""));
  const fb = make("p", "fb");
  ex.spots.forEach((s, i) => {
    const b = make("button", "spot"); b.type = "button"; b.setAttribute("aria-label", s.label);
    Object.assign(b.style, { left: s.x + "%", top: s.y + "%", width: s.w + "%", height: s.h + "%" });
    b.append(make("span", "", String(i + 1)));
    b.onclick = () => {
      if (i === ex.ans) { b.classList.add("right"); fb.className = "fb good"; fb.textContent = "Chính xác. " + ex.why; wrap.querySelectorAll(".spot").forEach(x => x.disabled = true); }
      else { b.classList.add("wrongpick"); fb.className = "fb badc"; fb.textContent = "Chưa đúng. Nghe lại rồi chọn người khác."; }
    };
    wrap.append(b);
  });
  sheet.append(sec("Bước 2. Tìm", zhLine(ex.question), wrap, ...(ex.img ? [] : [make("p", "tip", "Hình ba người sẽ được thêm sau. Hiện bạn bấm vào vị trí 1, 2 hoặc 3.")]), fb));
  const s = make("div", "alist"); ex.script.forEach(e => s.append(zhLine(e)));
  sheet.append(sec("Bước 3. Xem lời", revealButton(s, "Hiển thị lời bài nghe"), s));
}
function exTalk(sheet, ex) {
  const box = make("div", "talks");
  ex.items.forEach(it => {
    const c = make("article", "tcard");
    c.append(make("h4", "", it.topic), zhLine(it.q));
    const a = make("div", "alist"); a.append(zhLine(it.a));
    c.append(revealButton(a, "Xem câu trả lời mẫu"), a);
    box.append(c);
  });
  sheet.append(make("p", "tip", "Làm theo cặp: một bạn hỏi, một bạn trả lời, rồi đổi vai. Nói theo ý của mình trước, sau đó mới xem câu mẫu."), box);
}

/* Bài khóa trình bày như trong sách; câu đang đọc được tô sáng */
function renderText(sheet, v, topic) {
  const head = make("header", "head"); head.append(make("h2", "", v.title));
  const side = make("div", "vside");
  if (v.image) { const p = make("div", "pic apic has"); const img = make("img"); img.src = v.image; img.alt = v.title; p.append(img); side.append(p); }
  else side.append(ph("Tranh bài khóa sẽ được thêm sau"));
  const list = make("ol", "kw"), rows = [];
  let media = null;
  const mark = i => rows.forEach((r, k) => { r.classList.toggle("now", k === i); if (k === i) r.scrollIntoView({ block: "nearest" }); });
  const bar = make("div", "kwbar");
  const vi = make("button", "show", "Hiện nghĩa tiếng Việt"); vi.type = "button";
  let showVi = false;
  vi.onclick = () => { showVi = !showVi; vi.textContent = showVi ? "Ẩn nghĩa tiếng Việt" : "Hiện nghĩa tiếng Việt"; list.querySelectorAll(".v").forEach(x => x.hidden = !showVi); };
  function playFrom(i, all) {
    stopAudio();
    if (media) { media.currentTime = v.lines[i].start; videoStop = all ? null : v.lines[i].end; media.play().catch(() => {}); return; }
    if (zhVoiceMissing()) return noVoice();
    const seq = all ? v.lines.slice(i) : [v.lines[i]];
    seq.forEach((l, k) => {
      const u = new SpeechSynthesisUtterance(l.han); u.lang = "zh-CN"; u.rate = 0.85;
      u.onstart = () => mark(i + k);
      if (k === seq.length - 1) u.onend = () => mark(-1);
      speechSynthesis.speak(u);
    });
  }
  if (v.src) {
    media = make("audio", "abox"); media.controls = true; media.preload = "metadata"; media.src = v.src;
    media.ontimeupdate = () => {
      const t = media.currentTime;
      if (videoStop != null && t >= videoStop) { media.pause(); videoStop = null; }
      mark(v.lines.findIndex(l => t >= l.start && t < l.end));
    };
    media.onended = () => mark(-1);
    side.append(media);
  } else {
    const all = make("button", "show", "▶ Nghe cả bài"); all.type = "button"; all.onclick = () => playFrom(0, true);
    side.append(all, make("p", "tip", "Đang đọc bằng giọng máy, file ghi âm sẽ được thêm sau."));
  }
  v.lines.forEach((l, i) => {
    const li = make("li", "kwl"); li.tabIndex = 0; li.title = "Bấm để nghe câu này";
    const who = make("div", "kwho"); who.append(zp(l.whoZh, l.whoPy));
    const t = make("div", "kwt");
    const p = linkedText(make("div", "p"), l.py, l.links); p.lang = "zh-Latn-pinyin";
    p.querySelectorAll(".jump").forEach(j => j.addEventListener("click", ev => ev.stopPropagation()));
    const h = make("div", "h", l.han); h.lang = "zh-CN";
    const vv = make("div", "v", l.vi); vv.hidden = true;
    t.append(p, h, vv);
    li.append(who, t);
    li.onclick = () => playFrom(i, false);
    li.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); playFrom(i, false); } };
    rows.push(li); list.append(li);
  });
  const pyb = make("button", "show", "Ẩn phiên âm"); pyb.type = "button";
  let showPy = true;
  pyb.onclick = () => { showPy = !showPy; pyb.textContent = showPy ? "Ẩn phiên âm" : "Hiện phiên âm"; list.querySelectorAll(".kwt > .p, .kwho .p").forEach(x => x.hidden = !showPy); };
  bar.append(pyb, vi);
  const s1 = make("section", "step");
  s1.append(make("h3", "", "Bài khóa"), make("p", "tip", "Bấm vào một câu để nghe câu đó. Bấm từ gạch chân để xem lại từ."), bar, list);
  const s2 = make("section", "step");
  s2.append(make("h3", "", "Trả lời câu hỏi"));
  const qs = make("ol", "lines");
  v.questions.forEach(q => {
    const li = make("li", "q");
    const ql = make("div", "gx"); const qt = make("div", "txt"); qt.append(zp(q.han, q.py)); ql.append(qt, speaker("", q.han));
    li.append(ql, make("div", "tip", q.vi));
    const ans = make("div", "alist"); ans.append(zhLine({ han: q.aHan, py: q.aPy, vi: q.aVi }));
    li.append(revealButton(ans, "Hiển thị đáp án"), ans);
    qs.append(li);
  });
  s2.append(qs);
  const steps = make("div", "vsteps"); steps.append(s1, s2);
  if (v.src && v.dl) steps.append(downloadRow(v));
  const wrap = make("div", "vstudy"); wrap.append(side, steps);
  sheet.append(head, wrap, itemNav(topic));
}

renderTopics(); renderWords(); renderSheet();
</script>
